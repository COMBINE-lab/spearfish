[package]
name = "spearfish-splice"
description = "Spliced genome mapping for the spearfish long-read mapper (in development)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
lcp-core.workspace = true
seeds.workspace = true
rayon.workspace = true
rustc-hash.workspace = true
anyhow.workspace = true
# DEFLATE for BAM output: zflate by default; the features below swap in another engine.
zflate = "1.0.0"
libdeflater = { version = "1.19", optional = true }
flate2 = { workspace = true, optional = true }
index.workspace = true

[features]
# BAM output's DEFLATE engine (default: zflate).
libdeflate = ["dep:libdeflater"]
zlib-rs = ["dep:flate2"]

[package]
name = "spearfish-splice"
description = "Spliced genome mapping for the spearfish long-read mapper (in development)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
lcp-core.workspace = true
seeds.workspace = true
rayon.workspace = true
rustc-hash.workspace = true
anyhow.workspace = true
# DEFLATE for BAM output: zlib-rs (through flate2) by default; the features below swap in a
# faster engine. zflate needs Rust 1.91, above the workspace's minimum, so it is opt-in.
flate2.workspace = true
zflate = { version = "1.0.0", optional = true }
libdeflater = { version = "1.19", optional = true }
index.workspace = true

[features]
# BAM output's DEFLATE engine (default: zlib-rs).
zflate = ["dep:zflate"]
libdeflate = ["dep:libdeflater"]

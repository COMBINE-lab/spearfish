[package]
name = "spearfish-splice"
description = "Spliced genome mapping of long RNA-seq reads for the spearfish mapper (use it through the spearfish crate)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["bioinformatics", "rna-seq", "long-reads", "splicing", "mapping"]
categories = ["science::bioinformatics"]

[dependencies]
lcp-core.workspace = true
seeds.workspace = true
rayon.workspace = true
rustc-hash.workspace = true
anyhow.workspace = true
# DEFLATE for BAM output: zlib-rs (through flate2) by default; the features below swap in a
# faster engine.
flate2.workspace = true
zflate = { version = "1.0.0", optional = true }
libdeflater = { version = "1.19", optional = true }
index.workspace = true
# Affine-gap alignment for the base-level output.
ksw2rs = "0.3.1"

[features]
# The development drivers `gmap` and `genome_probe` (the supported command is `spearfish`).
dev-bins = []
# BAM output's DEFLATE engine (default: zlib-rs).
zflate = ["dep:zflate"]
libdeflate = ["dep:libdeflater"]

[[bin]]
name = "gmap"
required-features = ["dev-bins"]

[[bin]]
name = "genome_probe"
required-features = ["dev-bins"]

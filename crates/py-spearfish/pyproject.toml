[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "spearfish"
requires-python = ">=3.9"
dynamic = ["version"]
description = "Python bindings for spearfish, a fast long-read RNA-seq mapper to the transcriptome"
readme = "README.md"
license = "BSD-3-Clause"
keywords = ["bioinformatics", "long reads", "rna-seq", "transcriptome", "read-mapping"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
pandas = ["pandas>=1.3"]
test = ["pytest>=7"]

[tool.maturin]
python-source = "python"
module-name = "spearfish._spearfish"

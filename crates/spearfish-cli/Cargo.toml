[package]
name = "spearfish-cli"
description = "Command-line interface to spearfish (long-read RNA-seq mapping with locally consistent parsing)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "spearfish"
path = "src/main.rs"
# `cargo doc` would write the binary's pages over the library's (both are `spearfish`).
doc = false

[dependencies]
spearfish.workspace = true
long-read-rad.workspace = true
anyhow.workspace = true
mimalloc.workspace = true
clap.workspace = true
lcp-core.workspace = true
paraseq.workspace = true
rustc-hash.workspace = true
rayon.workspace = true
index.workspace = true
map.workspace = true
quant.workspace = true
seeds.workspace = true
xxhash-rust.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
libc = "0.2"

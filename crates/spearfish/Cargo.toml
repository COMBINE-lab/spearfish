[package]
name = "spearfish"
description = "Fast long-read RNA-seq mapping to a transcriptome with locally consistent parsing (library)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["bioinformatics", "rna-seq", "long-reads", "transcriptome", "mapping"]
categories = ["science::bioinformatics"]

[dependencies]
anyhow.workspace = true
index.workspace = true
lcp-core.workspace = true
map.workspace = true
serde.workspace = true
serde_json.workspace = true
bon.workspace = true
log.workspace = true
xxhash-rust.workspace = true
long-read-rad = { workspace = true, optional = true }
paraseq = { workspace = true, optional = true }
# Not used directly: switches paraseq's gzip decoding to zlib-rs (see the workspace manifest).
flate2 = { workspace = true, optional = true }
# The compressed formats paraseq reads (see the workspace manifest).
niffler = { workspace = true, optional = true }
# Not used directly: bzip2's pure-Rust backend.
bzip2 = { workspace = true, optional = true }

[features]
default = ["fasta", "rad"]
# FASTA/FASTQ input helpers (read_transcripts, Index::build_from_fasta) via paraseq.
fasta = ["dep:paraseq", "dep:flate2", "dep:niffler", "dep:bzip2"]
# RAD output for oarfish (output::rad_writer, output::rad_record).
rad = ["dep:long-read-rad"]

# Reads transcripts from FASTA; skipped in builds without the feature.
[[test]]
name = "api"
required-features = ["fasta"]

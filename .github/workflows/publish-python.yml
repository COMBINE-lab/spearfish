name: Publish Python package

# Builds the `spearfish` Python package (crates/py-spearfish): abi3 wheels for Linux x86-64
# and arm64 (manylinux) and macOS (universal2), and an sdist. Tests every wheel on the
# platforms it serves, then publishes.
#
# - A tag `py-spearfish-vX.Y.Z` publishes to PyPI. The tag must name the version the package
#   builds as (the workspace version in Cargo.toml).
# - Run by hand (Actions > Publish Python package > Run workflow), it builds and tests, and
#   publishes to TestPyPI only if `testpypi` is ticked.
#
# Publishing uses PyPI trusted publishing: no token is stored. Each index needs a trusted
# publisher for this repository, this workflow (`publish-python.yml`), and the environment
# (`pypi` or `testpypi`), and the repository needs both environments.

on:
  push:
    tags: ["py-spearfish-v[0-9]*"]
  workflow_dispatch:
    inputs:
      testpypi:
        description: Publish to TestPyPI
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  wheels:
    name: Wheel (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners, so the C dependencies (zstd, xz) are not cross-compiled.
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64
          - os: macos-15
            target: universal2-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          working-directory: crates/py-spearfish
          args: --release --locked --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: crates/py-spearfish/dist

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag names the package version
        if: github.event_name == 'push'
        run: |
          v=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "py-spearfish"))')
          if [ "py-spearfish-v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the package version $v"
            exit 1
          fi
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: crates/py-spearfish
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: crates/py-spearfish/dist

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-24.04-arm, python: "3.13" }
          - { os: macos-15, python: "3.9" }
          - { os: macos-15, python: "3.13" }
          # The x86-64 half of the universal2 wheel.
          - { os: macos-15-intel, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      # For the tests and the toy fixture they map.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - run: python -m pip install numpy pandas pytest
      # Only the built wheels: a missing one fails here instead of building from source.
      - run: python -m pip install --no-index --find-links dist spearfish
      - run: python -m pytest crates/py-spearfish/tests

  publish:
    name: Publish to ${{ github.event_name == 'push' && 'PyPI' || 'TestPyPI' }}
    needs: [sdist, test]
    if: github.event_name == 'push' || inputs.testpypi
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && 'pypi' || 'testpypi' }}
      url: ${{ github.event_name == 'push' && 'https://pypi.org/project/spearfish/' || 'https://test.pypi.org/project/spearfish/' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - run: ls -l dist
      - if: github.event_name == 'push'
        uses: pypa/gh-action-pypi-publish@release/v1
      - if: github.event_name != 'push'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

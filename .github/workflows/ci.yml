name: CI
on: [push, pull_request]
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    strategy:
      fail-fast: false
      matrix:
        # x86-64 Linux, arm64 Linux and Apple Silicon: the SIMD kernels differ per architecture,
        # and every one must give the same output (the tests and `spearfish doctor` check it).
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: python3 fixtures/toy/make_toy.py && git diff --exit-code fixtures/toy
      - run: cargo run --release -q -p spearfish-cli -- doctor

  # The lower x86-64 SIMD levels, forced: the tests and the doctor self-test must agree with
  # the default level's.
  simd-levels:
    strategy:
      fail-fast: false
      matrix:
        level: [scalar, avx2]
    runs-on: ubuntu-latest
    env:
      SPEARFISH_SIMD: ${{ matrix.level }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo run --release -q -p spearfish-cli -- doctor

  # The scalar level on Apple Silicon, forced: the NEON kernels (the default there) must agree
  # with it.
  simd-levels-aarch64:
    runs-on: macos-15
    env:
      SPEARFISH_SIMD: scalar
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo run --release -q -p spearfish-cli -- doctor

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - run: cargo check --workspace --all-targets

name: CI
# Pull requests, and pushes to main: a pushed branch with an open PR would otherwise run every
# job twice. Other branches can be run by hand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A newer push to a pull request cancels its older run. Every other run gets a group of its own
# (one shared group would still cancel a queued run when a newer one arrives), so pushes to main
# are never cancelled and never wait on each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      # The release script (shellcheck is preinstalled on the runner).
      - run: shellcheck bump_and_publish.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        # x86-64 Linux, arm64 Linux and Apple Silicon: the SIMD kernels differ per architecture,
        # and every one must give the same output (the tests and `spearfish doctor` check it).
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # oarfish builds the library with default-features = false; keep that build compiling.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --locked -p spearfish --no-default-features --all-targets -- -D warnings
      - if: matrix.os == 'ubuntu-latest'
        run: cargo doc --locked --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo test --locked --workspace
      - run: python3 fixtures/toy/make_toy.py && git diff --exit-code fixtures/toy
      # The crates as crates.io would get them: each builds from its own package (files outside
      # a crate, such as fixtures, must be linked into it).
      - if: matrix.os == 'ubuntu-latest'
        run: cargo package --workspace --exclude lcp-oracle-sys --exclude py-spearfish
      # The SIMD level the tests ran at depends on the runner's CPU (hosted x86-64 runners may
      # lack AVX-512): the job summary shows it.
      - name: doctor
        shell: bash
        run: |
          cargo run --locked --release -q -p spearfish-cli -- doctor | tee doctor.txt
          { echo '```'; cat doctor.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # Lower x86-64 SIMD levels, forced: the tests and the doctor self-test must agree with the
  # runner's own level (avx2 repeats the default job on a runner without AVX-512).
  simd-levels:
    strategy:
      fail-fast: false
      matrix:
        level: [scalar, avx2]
    runs-on: ubuntu-latest
    env:
      SPEARFISH_SIMD: ${{ matrix.level }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --workspace
      - run: cargo run --locked --release -q -p spearfish-cli -- doctor

  # The scalar level on Apple Silicon, forced: the NEON kernels (the default there) must agree
  # with it.
  simd-levels-aarch64:
    runs-on: macos-15
    env:
      SPEARFISH_SIMD: scalar
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --workspace
      - run: cargo run --locked --release -q -p spearfish-cli -- doctor

  # The Python bindings (crates/py-spearfish): build the wheel and run its tests, on the oldest
  # and the newest CPython the wheel serves.
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: crates/py-spearfish
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install maturin pytest pandas
      - run: maturin build --locked --out dist
      # --no-index: once a release with this version number is on PyPI, pip may otherwise take
      # that wheel over the one just built (numpy is already here, with pandas).
      - run: python -m pip install --no-index --find-links dist spearfish
      # The CLI, for the test that the package's TSV and PAF are byte for byte spearfish map's.
      - run: cargo build --locked -p spearfish-cli
      - run: python -m pytest tests
        env:
          SPEARFISH_BIN: ${{ github.workspace }}/target/debug/spearfish

  # crates/nudgy, the allocator behind `--bump-alloc`, beyond its ordinary tests (the test
  # jobs above run those, the loom models of its cross-thread protocol among them): its small
  # tests under Miri, over several thread schedules, and its stress tests for longer and with
  # debug assertions.
  alloc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri test --locked -p nudgy --test miri --test paths --test config --test config_largest
        env:
          MIRIFLAGS: -Zmiri-many-seeds=0..8
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo +stable test --locked --release -p nudgy --test stress --test shadow
        env:
          STRESS_SECS: 10
          GENS: 100
          RUSTFLAGS: -C debug-assertions -C overflow-checks
      # The record of live blocks again, with the smallest and the largest limit.
      - run: |
          MAX_BLOCK=16 cargo +stable test --locked --release -p nudgy --test shadow
          MAX_BLOCK=32768 cargo +stable test --locked --release -p nudgy --test shadow
        env:
          GENS: 50
          RUSTFLAGS: -C debug-assertions -C overflow-checks

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - run: cargo check --locked --workspace --all-targets

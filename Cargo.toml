[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "BSD-3-Clause"
publish = false

[workspace.dependencies]
lcp-core = { path = "crates/lcp-core" }
lcp-oracle-sys = { path = "crates/lcp-oracle-sys" }
seeds = { path = "crates/seeds" }
index = { path = "crates/index" }
map = { path = "crates/map" }
quant = { path = "crates/quant" }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
proptest = "1.11"
cc = "1.5"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
paraseq = "0.6.1"
rustc-hash = "2.1"
rayon = "1.12"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1

# Tests exercise the parser on long inputs; keep them fast.
[profile.test]
opt-level = 2

[workspace]
resolver = "3"
members = ["crates/*"]
# Third-party checkouts (e.g. oarfish built against the spearfish library) live under data/.
exclude = ["data"]

[workspace.package]
edition = "2024"
# Oldest Rust the workspace builds with (libradicl and paraseq need 1.89); CI checks it.
rust-version = "1.89"
version = "0.1.0"
license = "BSD-3-Clause"
repository = "https://github.com/COMBINE-lab/spearfish"
homepage = "https://combine-lab.github.io/spearfish/"

[workspace.dependencies]
lcp-core = { package = "spearfish-lcp", path = "crates/lcp-core", version = "0.1.0" }
lcp-oracle-sys = { path = "crates/lcp-oracle-sys" }
seeds = { package = "spearfish-seeds", path = "crates/seeds", version = "0.1.0" }
index = { package = "spearfish-index", path = "crates/index", version = "0.1.0" }
map = { package = "spearfish-map", path = "crates/map", version = "0.1.0" }
spearfish = { path = "crates/spearfish", version = "0.1.0" }
long-read-rad = { path = "crates/rad", version = "0.1.0" }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
proptest = "1.11"
cc = "1.5"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
# Without its default features paraseq would read only plain files: niffler (below) picks the
# compressed formats.
paraseq = { version = "0.6.1", default-features = false, features = ["anyhow", "niffler"] }
# The compressed input formats: niffler's defaults without xz (lzma), which only added a C
# library (liblzma) for a format reads rarely come in, and without bgzip, which serves only
# niffler's seekable readers (BGZF reads as multi-member gzip). gzip and bzip2 decode in Rust;
# zstd stays on the C library until a pure-Rust decoder is as fast and as established.
niffler = { version = "3.0.1", default-features = false, features = ["gz", "bz2", "zstd"] }
# bzip2's pure-Rust backend (niffler takes bzip2 without one).
bzip2 = "0.6"
rustc-hash = "2.1"
rayon = "1.12"
memmap2 = "0.9"
bytemuck = "1.25"
mimalloc = { version = "0.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bon = "3.10"
log = "0.4"
# gzip input (through paraseq/niffler) decodes with zlib-rs, which takes precedence over flate2's
# default miniz_oxide backend once enabled anywhere in the build.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
clap_complete = "4.6"
clap_mangen = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1

# Release code with line tables, for profilers (see CONTRIBUTING.md).
[profile.profiling]
inherits = "release"
debug = "line-tables-only"

# Tests exercise the parser on long inputs; keep them fast.
[profile.test]
opt-level = 2
